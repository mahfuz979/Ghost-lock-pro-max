name: Build GhostLock APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find project (unzip GhostLock.zip if uploaded as ZIP)
        run: |
          PROJ=.
          if [ -f GhostLock.zip ]; then
            rm -rf _proj && mkdir _proj
            unzip -q GhostLock.zip -d _proj
            PROJ=$(dirname "$(find _proj -name settings.gradle.kts | head -1)")
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Project folder: $PROJ"

      - name: Build debug APK
        run: cd "$PROJ" && gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GhostLock-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GhostLock debug build ${{ github.run_number }}
          files: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
